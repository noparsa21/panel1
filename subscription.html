<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__USER_NAME__ - اشتراک</title>
    <style>
        :root {
            --bg: #f0fdf4;
            --card: #ffffff;
            --text: #064e3b;
            --muted: #047857;
            --accent: #059669;
            --border: #a7f3d0;
        }

        body.dark {
            --bg: #022c22;
            --card: #064e3b;
            --text: #ecfdf5;
            --muted: #6ee7b7;
            --accent: #34d399;
            --border: #065f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--muted);
            direction: ltr;
        }

        .info-box {
            background: rgba(5, 150, 105, 0.08);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-row span:first-child {
            color: var(--muted);
        }

        .info-row span:last-child {
            font-weight: 700;
        }

        .link-box {
            margin-top: 24px;
        }

        .link-box label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .link-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.8rem;
            direction: ltr;
            margin-bottom: 12px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            margin-top: 10px;
        }

        .theme-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>

    <div class="card">
        <div class="header">
            <h1>__USER_NAME__</h1>
            <p>__USER_ID__</p>
        </div>

        <div class="info-box">
            <div class="info-row">
                <span>حجم مصرف‌شده</span>
                <span>__TOTAL_GB__ / __LIMIT_TOTAL_GB__ GB</span>
            </div>
            <div class="info-row">
                <span>تاریخ انقضا</span>
                <span>__EXPIRY_DATE__</span>
            </div>
        </div>

        <div class="link-box">
            <label>لینک اشتراک</label>
            <input type="text" class="link-input" id="subLink" value="__SYNC_NORMAL__" readonly>
            <button class="btn" onclick="copyLink()">کپی لینک اشتراک</button>
            <button class="btn secondary" onclick="copyRaw()">کپی لینک خام</button>
        </div>
    </div>

    <div class="toast" id="toast">کپی شد!</div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const btn = document.querySelector('.theme-btn');
            btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function copyLink() {
            const link = document.getElementById('subLink');
            link.select();
            navigator.clipboard.writeText(link.value).then(showToast);
        }

        function copyRaw() {
            const link = document.getElementById('subLink').value;
            const rawLink = link + (link.includes('?') ? '&flag=raw' : '?flag=raw');
            navigator.clipboard.writeText(rawLink).then(showToast);
        }
    </script>
</body>
</html>
